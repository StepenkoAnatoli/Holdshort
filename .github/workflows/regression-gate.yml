name: regression-gate

# Mirrors the local pre-commit hook (.githooks/pre-commit) so the full gate
# also protects clones without the hook wired, and so required status checks
# catch --no-verify bypasses on main.
#
# The REQUIRED branch-protection context is "regression-gate" (the runbook
# documented name). The check-run name = "<job display name>" — the job keeps
# name: regression-gate for the context to match.
#
# On: every push to main and every pull_request (any branch), so a green
# status is produced for exactly the commits protection looks at.
#
# workflow_dispatch additionally runs the ONBOARDING PROOF (setup-prove job):
# setup_machine.sh exercises the full fail-closed path end-to-end — clone,
# wire repo-local hooksPath, clean commit allowed, staged fake key REFUSED,
# the §0–§2 dry-run preflight, AND the runbook §5 session-close proof
# (pilot_close --with-sheet: single close command → closures + totals +
# mechanically-filled live-fill sheet in one artifact, intact + tally clean +
# idempotent) — against a throwaway clone. This keeps the onboarding path
# itself honest: if install_hooks.py, the hook, OR the close-report
# generation ever regresses, running this dispatch fails loudly instead of
# silently shipping enforcement theater.
#
# workflow_dispatch and the weekly schedule ALSO run the STRICT-MODE CANARY
# (strict-canary job): tools/strict_canary.py opens a throwaway pull request
# whose head is cut from an older main commit, places a green `regression-gate`
# check on that stale head, and proves both halves of Layer 3 — the merge API
# must refuse it (HTTP 405, the status the 2026-10-11 by-hand test recorded),
# and after `update-branch` the same pull request must become mergeable. The
# synthetic check is disclosed as not-gate-evidence in its own output, because
# GITHUB_TOKEN-authored events start no workflow runs, so CI cannot supply the
# green check that makes the refusal attributable to staleness. The pull request
# and branch are deleted on every path; a 2xx from the attempted merge is
# reported as a protection regression, not as a pass. Layer 3 is configuration
# and can be switched off — this job is what notices.
#
# strict-canary is deliberately NOT a required status context: it runs only on
# dispatch and schedule, so requiring it would block every pull request that
# could never produce it.
#
# Exit codes from the canary: 0 proved, 1 the probe ran and did not pass (including
# a merge that was wrongly accepted), 2 no token, 3 the environment refuses a step
# the probe needs — for instance a repository that forbids Actions-created pull
# requests, where the job reports CANNOT PROBE rather than a verdict.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: re-prove the gate and the onboarding path even in quiet periods
    # (no pushes). Monday ~03:20 UTC; keeps protection honest over time.
    - cron: "20 3 * * 1"

# Ordinary verification needs read access; the canary retains its scoped overrides.
permissions:
  contents: read

jobs:
  gate:
    name: regression-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run the full regression gate (mirror of the pre-commit hook)
        run: python tools/run_regression.py

  watcher-once:
    name: watcher-once-proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Watcher --once against a synthetic store (dirty alerts, clean silent)
        run: python tools/ci_watcher_once_proof.py

  setup-prove:
    name: onboarding-proof
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Onboarding proof — clone, wire hooks, prove clean-pass + leak-refusal
        run: |
          bash tools/setup_machine.sh \
            "file://${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/proof-clone"
          echo "setup proof: PASS (a fresh machine would be enforcing by default)"

  strict-canary:
    name: strict-canary
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write # create and delete the throwaway branch
      pull-requests: write # open and close the throwaway PR, update-branch
      checks: write # the synthetic green check (a precondition, not evidence)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Strict-mode canary — stale head refused, refreshed head mergeable
        env:
          # The job's own token is normally enough. A dedicated CANARY_TOKEN is the
          # alternative when the repository forbids Actions from creating pull
          # requests (Settings → Actions → General): otherwise the probe cannot open
          # its throwaway PR and exits 3 (CANNOT PROBE) instead of reporting a verdict.
          GH_TOKEN: ${{ secrets.CANARY_TOKEN || github.token }}
        run: python tools/strict_canary.py --repo "$GITHUB_REPOSITORY"
