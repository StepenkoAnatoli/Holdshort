<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
  <title id="title">Holdshort — right model, clear boundaries</title>
  <desc id="desc">A visual overview of the routing policy. Define a task brief, check permissions, capabilities, verification, affordability and economics, then recommend a route. Work is autonomous by default with human review on request. The host enforces dispatch, verification and budgets.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b36"/><stop offset="1" stop-color="#182849"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#766bff" stop-opacity=".32"/><stop offset="1" stop-color="#766bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent"><stop stop-color="#8ee8d5"/><stop offset="1" stop-color="#c5baff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d5dfff" stroke-opacity=".055"/></pattern>
    <clipPath id="bounds"><rect width="1400" height="660" rx="24"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#030b20" flood-opacity=".3"/></filter>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1400" height="660" fill="url(#bg)"/>
    <rect width="1400" height="660" fill="url(#grid)"/>
    <ellipse cx="1100" cy="260" rx="680" ry="580" fill="url(#glow)"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <g transform="translate(64 42)" fill="none" stroke-width="3">
        <path d="M14 26h24M38 26V10h20M38 26v16h20" stroke="#98e8dc"/>
        <circle cx="10" cy="26" r="6" fill="#98e8dc" stroke="#98e8dc"/>
        <circle cx="64" cy="10" r="6" fill="#b8aeff" stroke="#b8aeff"/>
        <circle cx="64" cy="42" r="6" fill="#98e8dc" stroke="#98e8dc"/>
      </g>
      <text x="158" y="79" fill="#fff" font-size="38" font-weight="700" letter-spacing="-.7">Holdshort</text>
      <rect x="1140" y="43" width="196" height="40" rx="20" fill="#ffffff" fill-opacity=".07" stroke="#6d7e9e" stroke-opacity=".5"/>
      <text x="1238" y="69" text-anchor="middle" fill="#dce7ff" font-size="16" font-weight="600" letter-spacing="1.3">POLICY PREVIEW</text>
      <text x="64" y="173" fill="#b8c8e4" font-size="17" font-weight="600" letter-spacing="2.4">MODEL ROUTING FOR CODING AGENTS</text>
      <text x="60" y="261" fill="#fff" font-size="78" font-weight="700" letter-spacing="-2.8">Right model.</text>
      <text x="60" y="347" fill="url(#accent)" font-size="78" font-weight="700" letter-spacing="-2.8">Clear boundaries.</text>
      <text x="64" y="406" fill="#b8c8e4" font-size="25">Make model choices explicit.</text>
      <text x="64" y="444" fill="#b8c8e4" font-size="25">Verify the result. Keep limits visible.</text>
      <rect x="64" y="486" width="242" height="42" rx="21" fill="#89e8d0" fill-opacity=".1" stroke="#89e8d0" stroke-opacity=".35"/>
      <circle cx="86" cy="507" r="4" fill="#8ee8d5"/>
      <text x="101" y="513" fill="#d3fff4" font-size="18" font-weight="600">Autonomous by default</text>
      <rect x="322" y="486" width="285" height="42" rx="21" fill="#c0b2ff" fill-opacity=".1" stroke="#c0b2ff" stroke-opacity=".35"/>
      <text x="344" y="513" fill="#e3ddff" font-size="18" font-weight="600">Human review on request</text>
      <g filter="url(#shadow)">
        <rect x="738" y="132" width="598" height="414" rx="20" fill="#f7f9ff"/>
      </g>
      <text x="770" y="171" fill="#687792" font-size="14" font-weight="700" letter-spacing="1.8">FROM TASK TO RECOMMENDATION</text>
      <rect x="770" y="193" width="534" height="70" rx="12" fill="#fff" stroke="#d9e1ef"/>
      <rect x="788" y="208" width="38" height="38" rx="10" fill="#e8edff"/>
      <text x="807" y="234" text-anchor="middle" fill="#675acd" font-size="20" font-weight="700">1</text>
      <text x="846" y="221" fill="#172746" font-size="21" font-weight="700">Define the task</text>
      <text x="846" y="245" fill="#697a96" font-size="17">Objective, data and acceptance checks</text>
      <path d="M1037 267v16m-5-5 5 5 5-5" fill="none" stroke="#a5b3ce" stroke-width="2"/>
      <rect x="770" y="292" width="534" height="126" rx="12" fill="#edf3ff" stroke="#cfdbf2"/>
      <rect x="788" y="310" width="38" height="38" rx="10" fill="#d8e8ff"/>
      <text x="807" y="336" text-anchor="middle" fill="#3269bc" font-size="20" font-weight="700">2</text>
      <text x="846" y="327" fill="#172746" font-size="21" font-weight="700">Check eligibility first</text>
      <text x="846" y="359" fill="#44638e" font-size="17">Permissions · Capabilities · Verification</text>
      <text x="846" y="388" fill="#44638e" font-size="17">Affordability · Economics</text>
      <path d="M1037 422v16m-5-5 5 5 5-5" fill="none" stroke="#a5b3ce" stroke-width="2"/>
      <rect x="770" y="447" width="534" height="72" rx="12" fill="#fff" stroke="#d9e1ef"/>
      <rect x="788" y="463" width="38" height="38" rx="10" fill="#def5ed"/>
      <text x="807" y="489" text-anchor="middle" fill="#27866b" font-size="20" font-weight="700">3</text>
      <text x="846" y="477" fill="#172746" font-size="21" font-weight="700">Recommend a route</text>
      <text x="846" y="501" fill="#697a96" font-size="15">Direct · Delegate · Speculative · Escalate · Blocked</text>
      <path d="M64 574h1272" stroke="#667b9f" stroke-opacity=".35"/>
      <text x="64" y="613" fill="#93a7c8" font-size="17" font-weight="500" letter-spacing=".4">ADVISORY POLICY</text>
      <circle cx="258" cy="607" r="3" fill="#8299bd"/>
      <text x="279" y="613" fill="#c0cde3" font-size="18">The host enforces dispatch, verification and budgets.</text>
      <text x="1336" y="613" text-anchor="end" fill="#a6b5d1" font-size="18">v3.0</text>
    </g>
  </g>
</svg>
