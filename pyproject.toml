[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "holdshort-tools"
version = "3.0.0"
description = "Model-routing policy tools and local supervision helpers for coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "See LICENSE" }
authors = [{ name = "StepenkoAnatoli" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
holdshort-validate-skills = "tools.validate_skills:main"
holdshort-regression = "tools.run_regression:main"
holdshort-watchdog = "tools.host_watchdog:main"

[tool.setuptools]
packages = ["tools"]

[tool.setuptools.package-data]
tools = ["*.json", "*.sh", "calibration/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
